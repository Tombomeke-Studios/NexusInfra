name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  validate:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (shared first, then services)
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test (community edition — the default)
        run: npm test

      # Roughly half the edition-gated behaviour (billing routes, quota checks,
      # signup policy) only runs when NEXUS_EDITION=hosted. Testing the default
      # alone leaves it uncovered (#173).
      - name: Test (hosted edition)
        run: npm test
        env:
          NEXUS_EDITION: hosted

  # Against a real broker and database (#242): bindings, encryption on the wire,
  # dead-lettering, the migrations from nothing, unique-index races, and the
  # command → agent → report loop. The unit suite replaces each of these with a
  # captured function, so a broken binding used to pass CI.
  integration:
    name: Integration (RabbitMQ + database)
    runs-on: ubuntu-latest
    services:
      # Both databases the panel supports (#241): SQLite needs nothing running;
      # PostgreSQL is this service.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Each service's PostgreSQL migrations, replayed into a scratch database,
      # must produce exactly its schema. A model changed without a PostgreSQL
      # migration fails here, not on somebody's upgrade (#241).
      - name: PostgreSQL migrations match the schema
        run: |
          for svc in orchestrator billing-bridge; do
            (cd services/$svc && npx prisma migrate diff --exit-code \
              --from-migrations prisma/postgres/migrations \
              --to-schema-datamodel prisma/postgres/schema.prisma \
              --shadow-database-url "postgresql://nexus:nexus@localhost:5432/nexus?schema=shadow_$svc") \
              || { echo "::error::$svc: prisma/postgres/migrations do not produce prisma/postgres/schema.prisma — add a PostgreSQL migration"; exit 1; }
          done

      - name: Integration tests
        run: npm run test:integration
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          # Fail rather than skip if the broker or the database is missing.
          REQUIRE_BROKER: '1'
          TEST_POSTGRES_URL: postgresql://nexus:nexus@localhost:5432/nexus
          REQUIRE_POSTGRES: '1'

  # The images run a different Node than CI does, with only their production
  # dependencies. A dependency that needs a newer Node passed every test above
  # and still crashed the orchestrator image at start (#416). Each image the
  # node lab pulls is built and started here, and must answer /health.
  images:
    name: Images start (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: orchestrator, port: 9200 }
          - { service: gateway, port: 9400 }
          - { service: control-room, port: 9000 }
          - { service: node-agent, port: 9100 }
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ci/${{ matrix.service }} .

      # No broker and no Docker socket: each service keeps its HTTP up without
      # them, so a container that exits here failed to load, not to connect.
      - name: Start it and wait for /health
        run: |
          docker run -d --name svc -p ${{ matrix.port }}:${{ matrix.port }} ci/${{ matrix.service }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:${{ matrix.port }}/health > /dev/null; then echo "healthy after ${i}s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' svc)" != "true" ]; then echo "::error::the ${{ matrix.service }} image exited at start"; docker logs svc; exit 1; fi
            sleep 1
          done
          echo "::error::the ${{ matrix.service }} image did not answer /health within 60s"
          docker logs svc
          exit 1
