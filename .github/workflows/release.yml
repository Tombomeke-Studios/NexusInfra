name: Release

# Publishes container images for a tagged release (#179).
#
# NexusInfra ships as two products from one codebase: `community` (self-hosted,
# no billing) and `hosted` (multi-tenant, FinVault billing on). The edition is a
# runtime flag, so the images differ only in the default it is built with —
# separate tags exist to make the intended one obvious at a glance rather than to
# lock an image to an edition.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0-rc1). Defaults to the tag.'
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  # A release is only worth publishing if it would have passed CI.
  validate:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present
      - run: npm test
      - run: npm test
        env:
          NEXUS_EDITION: hosted

  services:
    name: ${{ matrix.service }} · ${{ matrix.edition }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [control-room, node-agent, orchestrator, gateway, dashboard]
        edition: [community, hosted]
        include:
          # Billing only exists in the hosted edition, so a community image of it
          # would be an image of nothing.
          - service: billing-bridge
            edition: hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and image namespace
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR rejects a mixed-case repository name, and the GitHub owner is
          # not necessarily lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Every service Dockerfile copies `shared/` plus its own directory, so
          # the build context is always the repo root.
          context: ${{ matrix.service == 'dashboard' && './dashboard' || '.' }}
          file: ${{ matrix.service == 'dashboard' && 'dashboard/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            NEXUS_EDITION=${{ matrix.edition }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-${{ matrix.service }}:${{ steps.meta.outputs.version }}-${{ matrix.edition }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-${{ matrix.service }}:${{ matrix.edition }}
          # The two editions differ only in a build arg, so the second leg is
          # almost entirely cache hits.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  bundles:
    name: Attach the release archive
    needs: [services]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # One archive containing both editions and the installer (#192), rather
      # than a tarball per edition. Choosing an edition is a question the
      # installer asks, not a download you have to get right beforehand.
      - name: Package the release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="nexusinfra-$VERSION"
          mkdir -p "$STAGE"
          cp -r deploy/community deploy/hosted "$STAGE/"
          cp deploy/install.sh deploy/install.ps1 deploy/README.md "$STAGE/"
          chmod +x "$STAGE/install.sh"
          # Pin both bundles to this exact release, so an archive keeps
          # installing the same thing however old it is.
          for edition in community hosted; do
            printf '\n# Pinned by the %s release archive.\nNEXUSINFRA_VERSION=%s-%s\n' \
              "$VERSION" "$VERSION" "$edition" >> "$STAGE/$edition/.env.example"
          done
          zip -rq "$STAGE.zip" "$STAGE"
          tar -czf "$STAGE.tar.gz" "$STAGE"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nexusinfra-*.zip
            nexusinfra-*.tar.gz
          generate_release_notes: true
