name: Release

# Publishes container images for a tagged release (#179).
#
# NexusInfra ships as two products from one codebase: `community` (self-hosted,
# no billing) and `hosted` (multi-tenant, FinVault billing on). The edition is a
# runtime flag, so the images differ only in the default it is built with —
# separate tags exist to make the intended one obvious at a glance rather than to
# lock an image to an edition.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0-rc1). Defaults to the tag.'
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  # A release is only worth publishing if it would have passed CI.
  validate:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present
      - run: npm test
      - run: npm test
        env:
          NEXUS_EDITION: hosted

  services:
    name: ${{ matrix.service }} · ${{ matrix.edition }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [control-room, node-agent, orchestrator, gateway]
        edition: [community, hosted]
        include:
          # Billing only exists in the hosted edition, so a community image of it
          # would be an image of nothing.
          - service: billing-bridge
            edition: hosted
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and image namespace
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR rejects a mixed-case repository name, and the GitHub owner is
          # not necessarily lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Every service Dockerfile copies `shared/` plus its own directory, so
          # the build context is always the repo root.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            NEXUS_EDITION=${{ matrix.edition }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-${{ matrix.service }}:${{ steps.meta.outputs.version }}-${{ matrix.edition }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-${{ matrix.service }}:${{ matrix.edition }}
          # The two editions differ only in a build arg, so the second leg is
          # almost entirely cache hits.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  dashboard:
    # The dashboard reads its edition at runtime from the Orchestrator's
    # /config, so there is nothing to bake in and nothing to fork: one image
    # serves both editions.
    name: dashboard (edition-neutral)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and image namespace
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR rejects a mixed-case repository name, and the GitHub owner is
          # not necessarily lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-dashboard:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/nexusinfra-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  bundles:
    name: Attach the deployment bundles
    needs: [services, dashboard]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package each edition's compose bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for edition in community hosted; do
            tar -czf "nexusinfra-$edition-$VERSION.tar.gz" -C deploy "$edition"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: nexusinfra-*.tar.gz
          generate_release_notes: true
