# The dashboard, plus /api proxied to the orchestrator in this same container.
# Mirrors dashboard/nginx.conf; only the upstream host differs, since here
# everything is on localhost rather than a Compose network.
server {
  listen 80;

  location /api/ {
    proxy_pass http://127.0.0.1:9200/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # The caller's real address (#401). Without these every request reached the
    # orchestrator from 127.0.0.1, so the login limiter put the whole
    # installation in one bucket. nexusinfra-init sets TRUST_PROXY=1 for this hop.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upgrade to WebSocket for the interactive terminal; harmless otherwise.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Stream Server-Sent Events (live logs) without buffering.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    # The orchestrator owns the upload limit (MAX_UPLOAD_BYTES, 64 MB by default,
    # #263). nginx's own default is 1 MB, which refused every plugin JAR and world
    # zip before the orchestrator saw it (#389) — so nginx sets none, and streams
    # the body through instead of spooling it to disk first.
    client_max_body_size 0;
    proxy_request_buffering off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
