# The dashboard, plus /api proxied to the orchestrator in this same container.
# Mirrors dashboard/nginx.conf; only the upstream host differs, since here
# everything is on localhost rather than a Compose network.
server {
  listen 80;

  location /api/ {
    proxy_pass http://127.0.0.1:9200/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # Upgrade to WebSocket for the interactive terminal; harmless otherwise.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Stream Server-Sent Events (live logs) without buffering.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
