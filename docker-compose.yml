services:
  # Standalone RabbitMQ for local NexusInfra dev.
  # In a combined deployment with FinVault, omit this service and point
  # control-room's RABBITMQ_URL at FinVault's `finvault-rabbitmq` container so
  # both platforms share the same `finvault.events` topic exchange.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexusinfra-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  control-room:
    build:
      context: .
      dockerfile: services/control-room/Dockerfile
    container_name: nexusinfra-control-room
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NEXUS_EDITION=${NEXUS_EDITION:-community}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - FINVAULT_MESSAGE_KEY=${FINVAULT_MESSAGE_KEY}
    depends_on:
      - rabbitmq

  node-agent:
    build:
      context: .
      dockerfile: services/node-agent/Dockerfile
    container_name: nexusinfra-node-agent
    # Publishing 9100 is a dev convenience for poking the internal API directly.
    # It is NOT needed in production — the Orchestrator reaches the agent over the
    # compose network. Drop this mapping there to keep the surface off the host.
    ports:
      - "9100:9100"
    environment:
      - PORT=9100
      - NEXUS_EDITION=${NEXUS_EDITION:-community}
      - NODE_ID=node-local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - FINVAULT_MESSAGE_KEY=${FINVAULT_MESSAGE_KEY}
      # Must match the Orchestrator's value (#169).
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      # Advertised on the heartbeat so the Orchestrator routes this node's
      # deployments to this agent (#171). Uses the compose service DNS name.
      - AGENT_URL=http://node-agent:9100
    # The agent drives the host Docker daemon, so it needs the socket mounted.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - rabbitmq

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: nexusinfra-orchestrator
    ports:
      - "9200:9200"
      # SFTP to a server's files (#235). Remove SFTP_PORT below to turn it off.
      - "${SFTP_PUBLIC_PORT:-2022}:2022"
    environment:
      - PORT=9200
      # Must match every other service's edition — the Orchestrator serves
      # GET /config to the dashboard and gates plan-quota checks on it (#173).
      - NEXUS_EDITION=${NEXUS_EDITION:-community}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - FINVAULT_MESSAGE_KEY=${FINVAULT_MESSAGE_KEY}
      # SQLite unless ORCHESTRATOR_DATABASE_URL names PostgreSQL (#241).
      - DATABASE_URL=${ORCHESTRATOR_DATABASE_URL:-file:/data/orchestrator.db}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      # Administrator seeded on first start (#174). Override before exposing the
      # panel — the default password is well known and warns on every start.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - NODE_AGENT_URL=http://node-agent:9100
      - CONTROL_ROOM_URL=http://control-room:9000
      - BILLING_BRIDGE_URL=http://billing-bridge:9300
      # Must match the Node Agent's value (#169).
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
      - SFTP_PORT=2022
      # The port people connect to, shown on the Files tab.
      - SFTP_PUBLIC_PORT=${SFTP_PUBLIC_PORT:-2022}
      # Kept on the volume: a host key that changes on upgrade looks like an attack.
      - SFTP_HOST_KEY_PATH=/data/sftp_host_ed25519_key
    volumes:
      - orchestrator_data:/data
    depends_on:
      - rabbitmq

  # Billing Bridge — hosted edition only. With NEXUS_EDITION=community (default)
  # it stays inert (health only, no billing); set it to `hosted` to turn on
  # usage tracking, the credit wallet and the FinVault top-up flow.
  billing-bridge:
    build:
      context: .
      dockerfile: services/billing-bridge/Dockerfile
    container_name: nexusinfra-billing-bridge
    ports:
      - "9300:9300"
    environment:
      - PORT=9300
      - NEXUS_EDITION=${NEXUS_EDITION:-community}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - FINVAULT_MESSAGE_KEY=${FINVAULT_MESSAGE_KEY}
      # SQLite unless BILLING_DATABASE_URL names PostgreSQL — its own schema in
      # the same database, e.g. …/nexusinfra?schema=billing (#241).
      - DATABASE_URL=${BILLING_DATABASE_URL:-file:/data/billing.db}
      - BILLING_WALLET_ID=${BILLING_WALLET_ID:-nexusinfra}
    volumes:
      - billing_data:/data
    depends_on:
      - rabbitmq

  # API Gateway (#20) — single external entry point: CORS, per-client rate
  # limiting, token validation, and a streaming reverse proxy (WebSockets too, #69)
  # to the Orchestrator. Available on :9400 for scripts and nexusctl; the
  # dashboard's nginx still calls the Orchestrator directly.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: nexusinfra-gateway
    ports:
      - "9400:9400"
    environment:
      - PORT=9400
      - NEXUS_EDITION=${NEXUS_EDITION:-community}
      - ORCHESTRATOR_URL=http://orchestrator:9200
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - FINVAULT_MESSAGE_KEY=${FINVAULT_MESSAGE_KEY}
    depends_on:
      - orchestrator
      - rabbitmq

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: nexusinfra-dashboard
    ports:
      - "8095:80"
    # nginx proxies /api to the orchestrator service (see dashboard/nginx.conf).
    depends_on:
      - orchestrator

  # PostgreSQL (#241) — optional. SQLite (a file in the service's volume) is the
  # default and needs nothing running. To use this instead:
  #   1. set POSTGRES_PASSWORD and ORCHESTRATOR_DATABASE_URL (and BILLING_DATABASE_URL) in .env
  #   2. docker compose --profile postgres up -d
  # Moving an existing installation's data: docs/deployment.md#postgresql.
  postgres:
    image: postgres:16-alpine
    container_name: nexusinfra-postgres
    restart: unless-stopped
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusinfra}
      # Unset, the image refuses to start — which is the point.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: nexusinfra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-nexusinfra}']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the services on this network use it.

volumes:
  rabbitmq_data:
  orchestrator_data:
  billing_data:
  postgres_data:
