server {
  listen 80;

  # Proxy API calls to the Orchestrator (the trailing slash strips the /api prefix,
  # so /api/deployments -> orchestrator:9200/deployments).
  location /api/ {
    proxy_pass http://orchestrator:9200/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # The caller's real address, so per-IP rate limiting (#225) measures the
    # person rather than this container. The orchestrator only believes it when
    # TRUST_PROXY is set (#245).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upgrade to WebSocket for the interactive terminal (#71); harmless for
    # regular HTTP requests where the Upgrade header is absent.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Stream Server-Sent Events (live logs) without buffering.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    # The orchestrator owns the upload limit (MAX_UPLOAD_BYTES, 64 MB by default,
    # #263). nginx's own default is 1 MB, which refused every plugin JAR and world
    # zip before the orchestrator saw it (#389) — so nginx sets none, and streams
    # the body through instead of spooling it to disk first.
    client_max_body_size 0;
    proxy_request_buffering off;
  }

  # SPA: serve the built app and let client-side routing handle unknown paths.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
