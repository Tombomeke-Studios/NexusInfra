server {
  listen 80;

  # Proxy API calls to the Orchestrator: /api/deployments -> orchestrator:9200/deployments.
  #
  # Docker's embedded DNS, asked again every 10 seconds (#403). A host name in a
  # plain proxy_pass is resolved once, at start: recreate the orchestrator — which
  # `docker compose up -d` does after any change to its .env — and it comes back
  # on a new address while nginx keeps sending /api to the old one, so the whole
  # panel answers 502 until this container is restarted as well. Naming the
  # upstream through a variable makes nginx resolve it at request time instead.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $orchestrator http://orchestrator:9200;
    # With a variable upstream nginx no longer strips the location prefix for us,
    # so /api/deployments -> /deployments is done here. Query strings are kept.
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $orchestrator;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # The caller's real address, so per-IP rate limiting (#225) measures the
    # person rather than this container. The orchestrator only believes it when
    # TRUST_PROXY is set (#245).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upgrade to WebSocket for the interactive terminal (#71); harmless for
    # regular HTTP requests where the Upgrade header is absent.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Stream Server-Sent Events (live logs) without buffering.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    # The orchestrator owns the upload limit (MAX_UPLOAD_BYTES, 64 MB by default,
    # #263). nginx's own default is 1 MB, which refused every plugin JAR and world
    # zip before the orchestrator saw it (#389) — so nginx sets none, and streams
    # the body through instead of spooling it to disk first.
    client_max_body_size 0;
    proxy_request_buffering off;
  }

  # SPA: serve the built app and let client-side routing handle unknown paths.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
